{{ define "showbooster" }}
    <div class="pokemons">
        {{ range .Booster.Booster }}
            <div class="pokemon">
                <img src="{{ .Image }}" width="100">
                <p>Name : {{ .Name }}</p>
                <p>Types : {{ .Types }}</p>
            </div>
        {{ end }}
    </div>
{{ end }}
